<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="hotelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="hotelCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="750" rx="16" fill="url(#hotelBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Navigation & Power BI Header Bar -->
  <rect width="1200" height="56" rx="16" fill="#111827" />
  <rect y="44" width="1200" height="12" fill="#111827" />
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#1f2937" stroke-width="1" />

  <!-- Logo and App Title -->
  <rect x="24" y="12" width="32" height="32" rx="8" fill="url(#cyanGrad)" />
  <text x="33" y="33" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900">H</text>
  <text x="68" y="28" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800">HotelRevAI</text>
  <text x="68" y="42" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">REVENUE INTELLIGENCE • POWER BI + DAX</text>

  <!-- Filters & Date Slicers -->
  <rect x="520" y="14" width="160" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
  <text x="536" y="32" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11">📅 Date: YTD 2024</text>
  
  <rect x="692" y="14" width="150" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
  <text x="708" y="32" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11">🏨 Branch: Grand Resort</text>

  <rect x="854" y="14" width="140" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
  <text x="870" y="32" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11">🛏️ Room: All Classes</text>

  <rect x="1064" y="14" width="112" height="28" rx="6" fill="#06b6d4" />
  <text x="1080" y="32" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">🔄 Refresh DAX</text>

  <!-- Main Content Layout -->
  <g transform="translate(24, 76)">
    <!-- 4 Key BI KPI Cards -->
    <!-- KPI 1: RevPAR -->
    <g transform="translate(0, 0)">
      <rect width="270" height="106" rx="12" fill="url(#hotelCard)" stroke="#1f2937" stroke-width="1.5" />
      <text x="20" y="30" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">RevPAR (REV PER AVAILABLE ROOM)</text>
      <text x="20" y="66" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900">$184.20</text>
      <text x="20" y="90" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">▲ +12.8% vs last month</text>
      <!-- Mini Sparkline -->
      <polyline points="180,75 200,68 220,72 240,55 255,48" fill="none" stroke="#06b6d4" stroke-width="2.5" />
    </g>

    <!-- KPI 2: ADR -->
    <g transform="translate(294, 0)">
      <rect width="270" height="106" rx="12" fill="url(#hotelCard)" stroke="#1f2937" stroke-width="1.5" />
      <text x="20" y="30" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">AVERAGE DAILY RATE (ADR)</text>
      <text x="20" y="66" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900">$218.50</text>
      <text x="20" y="90" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">▲ +4.2% optimized rate</text>
      <polyline points="180,70 200,62 220,65 240,52 255,50" fill="none" stroke="#10b981" stroke-width="2.5" />
    </g>

    <!-- KPI 3: Occupancy -->
    <g transform="translate(588, 0)">
      <rect width="270" height="106" rx="12" fill="url(#hotelCard)" stroke="#1f2937" stroke-width="1.5" />
      <text x="20" y="30" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">OCCUPANCY RATE</text>
      <text x="20" y="66" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900">84.3%</text>
      <text x="20" y="90" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">Peak: 96% on Weekends</text>
      <circle cx="230" cy="62" r="24" fill="none" stroke="#1f2937" stroke-width="5" />
      <circle cx="230" cy="62" r="24" fill="none" stroke="#06b6d4" stroke-width="5" stroke-dasharray="125 150" stroke-linecap="round" />
    </g>

    <!-- KPI 4: Cancellation Rate -->
    <g transform="translate(882, 0)">
      <rect width="270" height="106" rx="12" fill="url(#hotelCard)" stroke="#1f2937" stroke-width="1.5" />
      <text x="20" y="30" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">CANCELLATION RATE</text>
      <text x="20" y="66" fill="#f43f5e" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900">14.2%</text>
      <text x="20" y="90" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">▼ -3.1% improved policy</text>
      <polyline points="180,50 200,58 220,62 240,68 255,75" fill="none" stroke="#f43f5e" stroke-width="2.5" />
    </g>

    <!-- Middle Row: Revenue & Occupancy Trend Chart (Left) + Booking Channel Breakdown (Right) -->
    <!-- Left Chart: Revenue Trend -->
    <g transform="translate(0, 126)">
      <rect width="720" height="300" rx="12" fill="url(#hotelCard)" stroke="#1f2937" stroke-width="1.5" />
      <text x="24" y="34" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Seasonal Revenue &amp; ADR Trajectory (12 Months)</text>
      <text x="24" y="52" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11">Visualizing price elasticity, peak holiday demand, and room revenue generation.</text>

      <!-- Chart Legend -->
      <circle cx="560" cy="34" r="4" fill="#06b6d4" />
      <text x="572" y="38" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="11">Total Revenue ($k)</text>
      <circle cx="670" cy="34" r="4" fill="#10b981" />
      <text x="682" y="38" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="11">ADR ($)</text>

      <!-- Grid lines -->
      <line x1="60" y1="90" x2="680" y2="90" stroke="#1e293b" stroke-dasharray="4,4" />
      <text x="30" y="94" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">$500k</text>

      <line x1="60" y1="140" x2="680" y2="140" stroke="#1e293b" stroke-dasharray="4,4" />
      <text x="30" y="144" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">$375k</text>

      <line x1="60" y1="190" x2="680" y2="190" stroke="#1e293b" stroke-dasharray="4,4" />
      <text x="30" y="194" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">$250k</text>

      <line x1="60" y1="240" x2="680" y2="240" stroke="#1e293b" stroke-dasharray="4,4" />
      <text x="30" y="244" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">$125k</text>

      <!-- Area + Line Graph -->
      <polygon points="80,210 140,195 200,165 260,180 320,130 380,115 440,95 500,120 560,110 620,85 660,75 660,250 80,250" fill="url(#areaFill)" />
      <polyline points="80,210 140,195 200,165 260,180 320,130 380,115 440,95 500,120 560,110 620,85 660,75" fill="none" stroke="#06b6d4" stroke-width="3" />
      
      <!-- ADR Green line -->
      <polyline points="80,180 140,175 200,160 260,170 320,145 380,135 440,120 500,135 560,130 620,110 660,105" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2" />

      <!-- X-axis Labels -->
      <text x="75" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Jan</text>
      <text x="135" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Feb</text>
      <text x="195" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Mar</text>
      <text x="255" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Apr</text>
      <text x="315" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">May</text>
      <text x="375" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Jun</text>
      <text x="435" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Jul</text>
      <text x="495" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Aug</text>
      <text x="555" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Sep</text>
      <text x="615" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Oct</text>
      <text x="655" y="270" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10">Nov</text>
    </g>

    <!-- Right Chart: Booking Channels & Commissions -->
    <g transform="translate(740, 126)">
      <rect width="412" height="300" rx="12" fill="url(#hotelCard)" stroke="#1f2937" stroke-width="1.5" />
      <text x="24" y="34" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Booking Channels &amp; Net Margin</text>
      <text x="24" y="52" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="11">Comparing direct website margins against 3rd-party OTAs.</text>

      <!-- Channel Bar 1: Direct Website -->
      <g transform="translate(24, 76)">
        <text x="0" y="14" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Direct Hotel Web (0% comm)</text>
        <text x="320" y="14" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">42% • $1.2M</text>
        <rect y="22" width="364" height="12" rx="6" fill="#1f2937" />
        <rect y="22" width="152" height="12" rx="6" fill="#10b981" />
      </g>

      <!-- Channel Bar 2: Booking.com -->
      <g transform="translate(24, 126)">
        <text x="0" y="14" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Booking.com (18% comm)</text>
        <text x="320" y="14" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">28% • $810k</text>
        <rect y="22" width="364" height="12" rx="6" fill="#1f2937" />
        <rect y="22" width="102" height="12" rx="6" fill="#06b6d4" />
      </g>

      <!-- Channel Bar 3: Expedia -->
      <g transform="translate(24, 176)">
        <text x="0" y="14" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Expedia Group (15% comm)</text>
        <text x="320" y="14" fill="#3b82f6" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">18% • $520k</text>
        <rect y="22" width="364" height="12" rx="6" fill="#1f2937" />
        <rect y="22" width="65" height="12" rx="6" fill="#3b82f6" />
      </g>

      <!-- Channel Bar 4: Corporate & Walk-In -->
      <g transform="translate(24, 226)">
        <text x="0" y="14" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Corporate Contracts</text>
        <text x="320" y="14" fill="#a855f7" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">12% • $350k</text>
        <rect y="22" width="364" height="12" rx="6" fill="#1f2937" />
        <rect y="22" width="44" height="12" rx="6" fill="#a855f7" />
      </g>
    </g>

    <!-- Bottom Row: Room Category Performance Table -->
    <g transform="translate(0, 444)">
      <rect width="1152" height="190" rx="12" fill="url(#hotelCard)" stroke="#1f2937" stroke-width="1.5" />
      
      <text x="24" y="30" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Room Class Usability &amp; Profitability Matrix</text>

      <!-- Table Header -->
      <text x="24" y="58" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">ROOM CLASS</text>
      <text x="240" y="58" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">TOTAL INVENTORY</text>
      <text x="440" y="58" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">OCCUPANCY %</text>
      <text x="640" y="58" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">ADR</text>
      <text x="820" y="58" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">RevPAR CONTRIBUTION</text>
      <text x="1030" y="58" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">STATUS</text>

      <line x1="24" y1="68" x2="1128" y2="68" stroke="#1f2937" stroke-width="1" />

      <!-- Row 1 -->
      <text x="24" y="96" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Executive Ocean Suite</text>
      <text x="240" y="96" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">45 Rooms</text>
      <text x="440" y="96" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">92.4%</text>
      <text x="640" y="96" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">$380.00</text>
      <text x="820" y="96" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">$351.12</text>
      <rect x="1030" y="82" width="76" height="20" rx="10" fill="#064e3b" />
      <text x="1046" y="96" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">High Yield</text>

      <!-- Row 2 -->
      <text x="24" y="132" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Deluxe King Room</text>
      <text x="240" y="132" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">120 Rooms</text>
      <text x="440" y="132" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">86.1%</text>
      <text x="640" y="132" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">$210.00</text>
      <text x="820" y="132" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">$180.81</text>
      <rect x="1030" y="118" width="76" height="20" rx="10" fill="#064e3b" />
      <text x="1046" y="132" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Optimal</text>

      <!-- Row 3 -->
      <text x="24" y="168" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Standard Double Queen</text>
      <text x="240" y="168" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">95 Rooms</text>
      <text x="440" y="168" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">74.5%</text>
      <text x="640" y="168" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="12">$145.00</text>
      <text x="820" y="168" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">$108.02</text>
      <rect x="1030" y="154" width="86" height="20" rx="10" fill="#451a03" />
      <text x="1042" y="168" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Review Price</text>
    </g>
  </g>
</svg>
